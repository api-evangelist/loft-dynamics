name: Loft Dynamics
description: 'Loft Dynamics is a Swiss aviation technology company (founded 2016, headquartered in
  Dübendorf, Switzerland with a North American office in Santa Monica) that builds virtual reality
  flight simulation training devices (FSTDs) for helicopters, fixed-wing aircraft, and eVTOLs. Its
  simulators combine full-scale replica cockpits, dynamic motion platforms, 360-degree VR visuals,
  and advanced pose tracking, and were the first VR aircraft simulators to earn EASA and FAA
  qualification. Products include VR simulators for the Airbus H145, Airbus H125, and Robinson R22
  helicopters, with Boeing 737 and eVTOL platforms in development. Customers include Alaska Airlines,
  the FAA, Airbus Helicopters, the LAPD, and Marshall University. The company operates the LoftHUB
  customer platform but publishes no public developer API, SDK, or API documentation surface.'
